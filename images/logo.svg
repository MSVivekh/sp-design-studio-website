<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none">
  <!-- Left house -->
  <g stroke="currentColor" stroke-width="2.5" fill="none">
    <!-- Left house outer -->
    <path d="M20 85 L20 45 L70 15 L120 45 L120 85 Z"/>
    <!-- Left house inner -->
    <path d="M30 80 L30 50 L70 25 L110 50 L110 80 Z"/>
    <!-- Left house door -->
    <rect x="55" y="55" width="18" height="25" rx="1"/>
    <!-- Left house window -->
    <rect x="80" y="52" width="16" height="14" rx="1"/>
  </g>
  <!-- Right house -->
  <g stroke="currentColor" stroke-width="2.5" fill="none">
    <!-- Right house outer -->
    <path d="M110 85 L110 45 L160 15 L210 45 L210 85 Z"/>
    <!-- Right house inner -->
    <path d="M120 80 L120 50 L160 25 L200 50 L200 80 Z"/>
    <!-- Right house door -->
    <rect x="145" y="55" width="18" height="25" rx="1"/>
    <!-- Right house window -->
    <rect x="170" y="52" width="16" height="14" rx="1"/>
  </g>
  <!-- Company name -->
  <text x="115" y="105" text-anchor="middle" font-family="'Didot', 'Playfair Display', Georgia, serif" font-size="11" font-weight="400" letter-spacing="1.5" fill="currentColor">S&amp;P Design Studio, LLC</text>
</svg>